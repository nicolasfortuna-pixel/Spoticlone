<!doctype html>

<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gratisfy</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="css/style.css" />

    <link rel="icon" type="image/png" href="./images/spoticlone-logo.png" />
  </head>

  <body class="pagina-player">
    <header>
      <div class="cabecalho-esquerda">
        <img
          src="images/spoticlone-logo.png"
          alt="Logo Gratisfy"
          class="logo"
        />

        <div>
          <h1>Gratisfy</h1>
          <p>Escolha uma música para ouvir</p>
        </div>
      </div>
    </header>

    <main>
      <div id="lista"></div>
    </main>

    <!-- Áudio -->
    <audio id="player"></audio>

    <!-- Player -->
    <dialog id="player-modal">
      <button
        id="btn-fechar-player"
        class="player-fechar"
        aria-label="Fechar player"
      >
        <i class="bi bi-x-lg"></i>
      </button>

      <img id="player-capa" alt="Capa da música" />

      <h2 id="player-titulo">Nenhuma música tocando</h2>

      <p id="player-artista"></p>

      <div class="controles">
        <button id="btn-anterior" aria-label="Música anterior">
          <i class="bi bi-skip-start-fill"></i>
        </button>

        <button id="btn-play" class="btn-play" aria-label="Tocar ou pausar">
          <i class="bi bi-play-fill"></i>
        </button>

        <button id="btn-proxima" aria-label="Próxima música">
          <i class="bi bi-skip-end-fill"></i>
        </button>
      </div>
    </dialog>

    <script type="module" src="js/index.js"></script>
  </body>
</html>
