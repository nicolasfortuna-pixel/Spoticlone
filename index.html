<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gratisfy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="./images/spoticlone-logo.png">
</head>
<body>
    <header>
        

    <div class="cabecalho-esquerda">

        <img
            src="images/spoticlone-logo.png"
            alt="Logo Spoticlone"
            class="logo"
        >

        <div>
            <h1>Gratisfy Admin</h1>
            <p>Gerencie sua coleção de músicas</p>
        </div>

    </div>

</header>

    <main>
        <div id="lista"></div>
    </main>

    <footer id="barra-player">
        <img id="player-capa" alt="">
        <div id="player-info">
            <strong id="player-titulo">Nenhuma música tocando</strong>
            <span id="player-artista"></span>
        </div>
        <audio id="player" controls></audio>
    </footer>

    <script type="module" src="js/index.js"></script>
</body>
</html>
